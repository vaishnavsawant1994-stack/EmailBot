version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/campaign_engine"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
  - package-ecosystem: "npm"
    directory: "/dashboard-next"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
